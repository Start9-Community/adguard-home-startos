name: Check upstream

# Opens an issue when AdGuard Home publishes a stable release newer than the
# image pinned in startos/manifest/index.ts.
on:
  schedule:
    - cron: '23 15 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Compare the pinned image with the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          manifest=$(gh api -H 'Accept: application/vnd.github.raw' \
            "repos/$GITHUB_REPOSITORY/contents/startos/manifest/index.ts")
          pinned=$(grep -oP "adguard/adguardhome:\Kv[0-9.]+" <<<"$manifest")
          latest=$(gh api 'repos/AdguardTeam/AdGuardHome/releases?per_page=100' \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)

          if [ "$(printf '%s\n' "$pinned" "$latest" | sort -V | tail -n 1)" = "$pinned" ]; then
            echo "Up to date: the package pins $pinned and the latest stable release is $latest."
            exit 0
          fi

          title="AdGuard Home $latest is available"
          issues=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 200 --json number,title,state)
          if jq -e --arg t "$title" 'any(.[]; .title == $t)' <<<"$issues" >/dev/null; then
            echo "An issue for $latest already exists."
            exit 0
          fi

          image="adguard/adguardhome:$latest"
          if tag=$(curl -fsS "https://hub.docker.com/v2/repositories/adguard/adguardhome/tags/$latest"); then
            arches=$(jq -r '[.images[].architecture] | unique | join(", ")' <<<"$tag")
            if jq -e '[.images[].architecture] | any(. == "amd64") and any(. == "arm64")' <<<"$tag" >/dev/null; then
              status="\`$image\` is on Docker Hub for amd64 and arm64."
            else
              status="\`$image\` is on Docker Hub, but only for $arches. The package needs amd64 and arm64."
            fi
          else
            status="\`$image\` is not on Docker Hub yet. Wait for it before bumping."
          fi

          body=$(cat <<EOF
          AdGuard Home [$latest](https://github.com/AdguardTeam/AdGuardHome/releases/tag/$latest) is out. This package pins $pinned.

          $status

          Follow [UPDATING.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/master/UPDATING.md) to bump the package.
          EOF
          )

          url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body")
          echo "Opened $url"

          jq -r '.[] | select(.state == "OPEN" and (.title | test("^AdGuard Home v[0-9.]+ is available$"))) | .number' <<<"$issues" \
            | while read -r n; do
                gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Superseded by #${url##*/}."
              done
